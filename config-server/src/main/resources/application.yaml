spring:
  application:
    name:config-server
  profiles:
    active: native     # profil natif : lit les fichiers du classpath
  cloud:
    config:
      server:
        native:
          search-locations: classpath:/config-repo/
        allow-override: true
        override-none: true
server:
  port: 8888

eureka:
  client:
    register-with-eureka: false
    fetch-registry: false
#    service-url:
#      defaultZone: http://discovery-service:8761/eureka/
