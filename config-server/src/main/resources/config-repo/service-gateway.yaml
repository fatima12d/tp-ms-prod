spring:
  application:
    name: service-gateway

  cloud:
    gateway:
      # Decouverte automatique des services Eureka
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true

      # Routes explicites
      routes:
        - id: service-client
          uri: lb://SERVICE-CLIENT
          predicates:
            - Path=/api/clients/**

        - id: service-commande
          uri: lb://SERVICE-COMMANDE
          predicates:
            - Path=/api/commandes/**

        - id: service-produit
          uri: lb://SERVICE-PRODUIT
          predicates:
            - Path=/api/produits/**

server:
  port: 8080

eureka:
  client:
    service-url:
      defaultZone: http://discovery-service:8761/eureka/
  instance:
    instance-id: ${spring.application.name}:${random.uuid}
    lease-renewal-interval-in-seconds: 5

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway,metrics
