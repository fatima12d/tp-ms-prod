
spring:
  application:
    name: service-discovery

server:
  port: 8761

# Eureka Server
eureka:
  client:
    register-with-eureka: false
    fetch-registry: false



# Actuator
management:
  endpoints:
    web:
      exposure:
        include: health,info,refresh,metrics
  endpoint:
    health:
      show-details: always
